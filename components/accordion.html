<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accordion – Nucleus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sds-typography-body-font-family);
      background: #f7f7f7;
      padding: 40px;
    }

    .back { display: inline-block; margin-bottom: 24px; font-size: 14px; color: var(--sds-color-text-default-secondary); text-decoration: none; }
    .back:hover { color: var(--sds-color-text-default-default); }
    h1 { font-size: var(--sds-typography-heading-size-base); font-weight: var(--sds-typography-heading-font-weight); color: var(--sds-color-text-default-default); margin-bottom: 32px; }

    /* Accordion wrapper */
    .accordion {
      display: flex;
      flex-direction: column;
      gap: var(--sds-size-space-400);
      width: 640px;
    }

    /* Each accordion item */
    .accordion-item {
      border: var(--sds-size-stroke-border) solid var(--sds-color-border-default-default);
      border-radius: var(--sds-size-radius-200);
      padding: var(--sds-size-padding-lg);
      cursor: pointer;
      user-select: none;
    }

    .accordion-item.collapsed {
      background: var(--sds-color-background-default-secondary);
      display: flex;
      align-items: center;
    }

    .accordion-item.expanded {
      background: var(--sds-color-background-default-default);
      display: flex;
      flex-direction: column;
      gap: var(--sds-size-space-200);
    }

    .accordion-title {
      display: flex;
      align-items: center;
      gap: var(--sds-size-space-200);
      width: 100%;
    }

    .accordion-item.collapsed .accordion-title { flex: 1 0 0; }

    .accordion-title span {
      flex: 1 0 0;
      font-size: var(--sds-typography-body-size-medium);
      font-weight: var(--sds-typography-body-font-weight-strong);
      line-height: var(--sds-typography-body-line-height);
      color: var(--sds-color-text-default-default);
    }

    .chevron {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chevron svg {
      width: 12px;
      height: 8px;
      stroke: var(--sds-color-icon-default-default);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accordion-content {
      font-size: var(--sds-typography-body-size-medium);
      font-weight: var(--sds-typography-body-font-weight-regular);
      line-height: var(--sds-typography-body-line-height);
      color: var(--sds-color-text-default-default);
      width: 100%;
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← Back to Nucleus</a>
  <h1>Accordion</h1>

  <div class="accordion" id="accordion">
    <div class="accordion-item expanded" data-index="0">
      <div class="accordion-title">
        <span>Title</span>
        <div class="chevron">
          <svg viewBox="0 0 12 8" aria-hidden="true"><polyline points="1,6 6,1 11,6" /></svg>
        </div>
      </div>
      <div class="accordion-content">
        Answer the frequently asked question in a simple sentence, a longish paragraph, or even in a list.
      </div>
    </div>

    <div class="accordion-item collapsed" data-index="1">
      <div class="accordion-title">
        <span>Title</span>
        <div class="chevron">
          <svg viewBox="0 0 12 8" aria-hidden="true"><polyline points="1,1 6,6 11,1" /></svg>
        </div>
      </div>
    </div>

    <div class="accordion-item collapsed" data-index="2">
      <div class="accordion-title">
        <span>Title</span>
        <div class="chevron">
          <svg viewBox="0 0 12 8" aria-hidden="true"><polyline points="1,1 6,6 11,1" /></svg>
        </div>
      </div>
    </div>

    <div class="accordion-item collapsed" data-index="3">
      <div class="accordion-title">
        <span>Title</span>
        <div class="chevron">
          <svg viewBox="0 0 12 8" aria-hidden="true"><polyline points="1,1 6,6 11,1" /></svg>
        </div>
      </div>
    </div>

    <div class="accordion-item collapsed" data-index="4">
      <div class="accordion-title">
        <span>Title</span>
        <div class="chevron">
          <svg viewBox="0 0 12 8" aria-hidden="true"><polyline points="1,1 6,6 11,1" /></svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.accordion-item');
    items.forEach((item) => {
      item.addEventListener('click', () => {
        const isExpanded = item.classList.contains('expanded');
        items.forEach((el) => {
          el.classList.remove('expanded');
          el.classList.add('collapsed');
          const content = el.querySelector('.accordion-content');
          if (content) content.remove();
          el.querySelector('.chevron svg').innerHTML = '<polyline points="1,1 6,6 11,1" />';
        });
        if (!isExpanded) {
          item.classList.remove('collapsed');
          item.classList.add('expanded');
          const content = document.createElement('div');
          content.className = 'accordion-content';
          content.textContent = 'Answer the frequently asked question in a simple sentence, a longish paragraph, or even in a list.';
          item.appendChild(content);
          item.querySelector('.chevron svg').innerHTML = '<polyline points="1,6 6,1 11,6" />';
        }
      });
    });
  </script>
</body>
</html>
